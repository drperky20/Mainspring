name: Release Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Run verification
        id: release_verify
        run: node scripts/run-command-with-log.mjs .ci-logs/release-verify.log pnpm verify
      - name: Upload failed verification log
        if: failure() && steps.release_verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-verify-log
          path: .ci-logs/release-verify.log
          if-no-files-found: error
          retention-days: 7
      - run: pnpm gateway:systems:check
      - run: pnpm gateway:dev:help
      - run: pnpm run desktop:typecheck
      - run: pnpm run desktop:build
      - run: pnpm examples:smoke
      - run: pnpm agentic:check
      - run: pnpm release:workflow:check
      - run: pnpm optional-verifiers:check
      - run: pnpm package:check
      - run: pnpm package:pack:check
      - run: npm pack --dry-run
      - run: node scripts/check-docker-compose-config.mjs
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run desktop:typecheck
      - run: pnpm run desktop:build
      - run: pnpm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mainspring-desktop-windows
          path: |
            apps/desktop/release/Mainspring Setup 0.1.0.exe
            apps/desktop/release/Mainspring Setup 0.1.0.exe.blockmap
  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Run verification
        id: desktop_macos_verify
        run: node scripts/run-command-with-log.mjs .ci-logs/desktop-macos-verify.log pnpm verify
      - name: Upload failed verification log
        if: failure() && steps.desktop_macos_verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-verify-log
          path: .ci-logs/desktop-macos-verify.log
          if-no-files-found: error
          retention-days: 7
      - run: pnpm run desktop:typecheck
      - run: pnpm run desktop:build
