name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install
      - run: pnpm doctor
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run security:mainspring
      - run: pnpm --filter @mainspring/console typecheck
      - run: pnpm --filter @mainspring/console build
