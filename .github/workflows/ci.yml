name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    if: github.ref == 'refs/heads/agent/source-snapshot-20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: mainspring-source-e1d31dba
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  source-matrix:
    if: github.ref != 'refs/heads/agent/source-snapshot-20260724'
    name: Source Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Run tests
        id: source_tests
        run: node scripts/run-command-with-log.mjs .ci-logs/source-tests-${{ runner.os }}.log pnpm test
      - name: Upload failed test log
        if: failure() && steps.source_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: source-test-log-${{ runner.os }}
          path: .ci-logs/source-tests-${{ runner.os }}.log
          if-no-files-found: error
          retention-days: 7
      - run: pnpm build

  verify:
    if: github.ref != 'refs/heads/agent/source-snapshot-20260724'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Run verification
        id: verify
        run: node scripts/run-command-with-log.mjs .ci-logs/verify-${{ runner.os }}.log pnpm verify
      - name: Upload failed verification log
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ runner.os }}
          path: .ci-logs/verify-${{ runner.os }}.log
          if-no-files-found: error
          retention-days: 7
